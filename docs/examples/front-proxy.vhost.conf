# Public front-proxy vhost (one per public host name).
# Requires: a2enmod proxy proxy_http ssl headers rewrite
# DocumentRoot serves the landing site; each coin is mounted by a file in /var/www/upstreams.d/.

<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com
    RewriteEngine on
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName example.com
    ServerAlias www.example.com
    ServerAdmin webmaster@example.com

    DocumentRoot /var/www/example.com/public
    ErrorDocument 404 /err/404/index.php
    ErrorLog  ${APACHE_LOG_DIR}/front-error.log
    CustomLog ${APACHE_LOG_DIR}/front-access.log combined

    SSLEngine On
    SSLCertificateFile    /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # --- proxy defaults ---
    ProxyRequests     Off
    SSLProxyEngine    On
    ProxyPreserveHost On
    ProxyTimeout      60

    # upstreams use self-signed certificates
    SSLProxyVerify        none
    SSLProxyCheckPeerCN   off
    SSLProxyCheckPeerName off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host  "example.com"

    Include "/var/www/upstreams.d/*.conf"

    <Directory /var/www/example.com/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
</IfModule>
