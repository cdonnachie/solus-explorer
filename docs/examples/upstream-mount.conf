# Front-proxy mount of one coin: /var/www/upstreams.d/<coin>.conf
# Included by the public vhost (examples/front-proxy.vhost.conf).
# Replace <coin>, <node>, <port>, example.com. Printed by script/create-upstream.php.

# canonicalize /<coin> -> /<coin>/
RedirectMatch 301 ^/<coin>$ /<coin>/

SSLProxyEngine On
ProxyPreserveHost On

# Tell upstream it is mounted under /<coin>
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Prefix "/<coin>"

ProxyPass        /<coin>/ https://<node>.example.com:<port>/ connectiontimeout=5 timeout=60 keepalive=On
ProxyPassReverse /<coin>/ https://<node>.example.com:<port>/

# Cookies: Path=/  ->  Path=/<coin>/
ProxyPassReverseCookiePath / /<coin>/

# --- Redirect fixes for Location headers emitted by the upstream ---

# 1) upstream points to its own host:port -> map to /<coin>/
Header edit Location "^https://<node>\.example\.com:<port>/(.*)$" "/<coin>/$1" \
  "expr=%{REQUEST_URI} =~ m#^/<coin>/#"

# 2) absolute self URL without /<coin> -> prefix it
Header edit Location "^https://example\.com/(?!<coin>/)(.*)$" "https://example.com/<coin>/$1" \
  "expr=%{REQUEST_URI} =~ m#^/<coin>/#"

# 3) root-relative Location -> prefix it
Header edit Location "^/(.*)$" "/<coin>/$1" \
  "expr=%{REQUEST_URI} =~ m#^/<coin>/#"

# 4) optional: append trailing slash when there is no ? or # and no trailing /
Header edit Location "^(/[^?#]*[^/?#])$" "$1/" \
  "expr=%{REQUEST_URI} =~ m#^/<coin>/#"
