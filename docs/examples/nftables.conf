#!/usr/sbin/nft -f
#
# Example ruleset for an explorer host. All addresses are documentation
# placeholders (RFC 5737: 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24);
# replace them with your own before loading. SSH listens on port 22 here.

flush ruleset

table inet filter {
    set blacklisted-ips {
        type ipv4_addr; flags interval;
        elements = {
            203.0.113.0/24, # example: abusive network
            198.51.100.77,  # example: single scanner address
        }
    }

    set remote-mgmt-ips {
        type ipv4_addr; flags interval;
        elements = {
            192.0.2.10,     # example: administrator workstation
            192.0.2.20,     # example: VPN gateway
        }
    }

    set coin-p2p-ports {
        type inet_service; flags interval;
        elements = {
            8767, # example: Ravencoin P2P
        }
    }

    # sub-path topology: upstream listener ports, reachable from the front proxy only
    set upstream-ports {
        type inet_service; flags interval;
        #elements = { 50501 }
    }

    set upstream-allowed-ips {
        type ipv4_addr; flags interval;
        #elements = { 198.51.100.10 } # example: front proxy
    }
    set coin-rpc-ports {
        type inet_service; flags interval;
        #elements = {  }
    }

    set rpc-allowed-ips {
        type ipv4_addr; flags interval;
    }

    set public-tcp-ports {
        type inet_service; flags interval;
        elements = { 80, 443 }
    }

    set public-udp-ports {
        type inet_service; flags interval;
    }

    set mgmt-tcp-ports {
        type inet_service; flags interval;
        elements = { 22 }
    }

    set mgmt-udp-ports {
        type inet_service; flags interval;
    }

    set restricted-tcp-ports {
        type inet_service; flags interval;
        elements = { 22, 53, 5353, 27017 }
    }

    set restricted-udp-ports {
        type inet_service; flags interval;
        elements = { 53 }
    }

    chain input {
        type filter hook input priority filter; policy drop;
        ip saddr @blacklisted-ips counter drop
        ct state invalid counter drop
        ct state established,related accept
        iifname "lo" accept
        # allow ICMP from unspecified hosts, but rate limited
        ip6 nexthdr ipv6-icmp icmpv6 type echo-request limit rate 2/second counter accept
        ip protocol icmp icmp type echo-request limit rate 2/second counter accept comment "limit ICPM request accepr rate"
        # coin p2p ports
        tcp dport @coin-p2p-ports accept comment "Access to coins P2P ports"
        # coin rpc ports
        ip saddr @rpc-allowed-ips tcp dport @coin-rpc-ports counter accept comment "Access to coins RPC port"
        # upstream listeners (sub-path topology)
        ip saddr @upstream-allowed-ips tcp dport @upstream-ports accept comment "Front proxy to upstream listeners"
        # management ports
        ip saddr @remote-mgmt-ips tcp dport @mgmt-tcp-ports accept comment "Management TCP ports"
        ip saddr @remote-mgmt-ips udp dport @mgmt-udp-ports accept comment "Management UDP ports"
        # protect restricted ports
        tcp dport @restricted-tcp-ports counter drop
        udp dport @restricted-udp-ports counter drop
        # public ports
        tcp dport @public-tcp-ports accept comment "Publicly accessible ports"
        udp dport @public-udp-ports accept  comment "Publicly accessible ports"
    }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        # port forwarding rules
        #example: iifname "eth0" tcp dport 2222 dnat ip to 10.0.0.33:22 comment "forwarding public port 2222/tcp to node-33:22/tcp"
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        # port forwarding rules
        #example: iifname "eth0" ip daddr 10.0.0.33 tcp dport 22 counter accept comment "forwarding SSH access to node-33"

    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        # masquerading traffic from the VPN to the Internet
        #iifname "wg0" oifname "eth0" masquerade
    }
}