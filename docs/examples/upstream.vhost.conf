# Upstream Apache vhost for one coin behind the front proxy.
# Written by script/create-upstream.php as /etc/apache2/sites-available/<coin>.upstream.conf
# Replace <port>, <node>, <coin>. Certificate from script/gencert.sh <node>.example.com

Listen <port>

<VirtualHost *:<port>>
    ServerName <node>.example.com

    DocumentRoot /var/www/<coin>.upstream/public
    DirectoryIndex index.html index.php

    <Directory /var/www/<coin>.upstream/public>
        AllowOverride All
        Require all granted
        Options -MultiViews
    </Directory>

    ErrorDocument 404 /err/404/index.php
    ErrorLog  ${APACHE_LOG_DIR}/<coin>-error.log
    CustomLog ${APACHE_LOG_DIR}/<coin>-access.log combined

    SSLEngine On
    SSLCertificateFile      /etc/cert/<node>/<node>.example.com.pem
    SSLCertificateKeyFile   /etc/cert/<node>/<node>.example.com.key

    DirectorySlash On
    RewriteEngine On

    # Serve existing files and directories as-is (must be first)
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]

    # If /path.php exists, serve it for /path
    RewriteCond %{REQUEST_FILENAME}\.php -f
    RewriteRule ^(.+)$ $1.php [L]

    # Else if /path/ exists, add trailing slash
    RewriteCond %{REQUEST_FILENAME}/ -d
    RewriteRule ^(.+[^/])$ $1/ [R=302,L]
</VirtualHost>
